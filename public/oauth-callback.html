<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authenticating with Microsoft 365 — JKLU Grievance Desk</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F3F2F1;
      color: #1B1B1B;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #FFFFFF;
      padding: 36px 32px;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #0078D4;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      margin: 12px 0 6px;
      color: #201F1E;
    }
    p {
      font-size: 13.5px;
      color: #605E5C;
      margin: 0;
      line-height: 1.5;
    }
  </style>
  <script src="/msal-redirect-bridge.min.js"></script>
</head>
<body>
  <div class="card">
    <svg width="32" height="32" viewBox="0 0 21 21" aria-hidden="true">
      <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
      <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
      <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
      <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
    </svg>
    <h2>Connecting to JKLU Portal</h2>
    <div class="spinner"></div>
    <p id="statusMsg">Completing Microsoft 365 authentication...</p>
  </div>

  <script>
    (async function () {
      const statusEl = document.getElementById("statusMsg");
      try {
        if (window.msalRedirectBridge && typeof window.msalRedirectBridge.broadcastResponseToMainFrame === "function") {
          await window.msalRedirectBridge.broadcastResponseToMainFrame();
          if (statusEl) statusEl.textContent = "Authenticated! Returning to portal...";
          return;
        }
      } catch (err) {
        if (statusEl) statusEl.textContent = "Redirecting back to portal...";
      }
      setTimeout(() => {
        window.location.replace("/" + window.location.hash + window.location.search);
      }, 400);
    })();
  </script>
</body>
</html>
