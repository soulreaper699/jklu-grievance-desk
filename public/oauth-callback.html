<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authenticating with Microsoft 365 — JKLU Grievance Desk</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F3F2F1;
      color: #1B1B1B;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #FFFFFF;
      padding: 36px 32px;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #0078D4;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      margin: 12px 0 6px;
      color: #201F1E;
    }
    p {
      font-size: 13.5px;
      color: #605E5C;
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg width="32" height="32" viewBox="0 0 21 21">
      <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
      <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
      <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
      <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
    </svg>
    <h2>Connecting to JKLU Portal</h2>
    <div class="spinner"></div>
    <p id="statusMsg">Verifying official Microsoft 365 credentials...</p>
  </div>

  <script>
    (function () {
      const hash = window.location.hash;
      const search = window.location.search;
      const payload = { type: "MS_OAUTH_RESPONSE", hash: hash, search: search };

      try {
        sessionStorage.setItem("ms_oauth_result", JSON.stringify(payload));
      } catch (e) {}

      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage(payload, "*");
          document.getElementById("statusMsg").textContent = "Authenticated! Returning to portal...";
          setTimeout(() => {
            window.close();
          }, 600);
        } catch (err) {
          window.location.replace("/" + hash);
        }
      } else {
        // Direct redirect without popup
        setTimeout(() => {
          window.location.replace("/" + hash);
        }, 500);
      }
    })();
  </script>
</body>
</html>
